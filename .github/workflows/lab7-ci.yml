name: LAB7 parallel / drift / Evidently
on:
  push:
    paths:
      - 'src/moons_lab/lab7_pipeline.py'
      - 'src/moons_lab/evidently_adapter.py'
      - 'src/moons_lab/drift.py'
      - 'src/moons_lab/service.py'
      - 'src/moons_lab/lab7_config.py'
      - 'src/moons_lab/generator.py'
      - 'scripts/run_lab7.py'
      - 'tests/test_lab7_complete.py'
      - 'tests/test_lab7_frozen_config.py'
      - 'tests/test_drift.py'
      - 'configs/lab7.json'
      - '.github/workflows/lab7-ci.yml'
  pull_request:
    paths:
      - 'src/moons_lab/**'
      - 'scripts/run_lab7.py'
      - 'tests/test_lab7_complete.py'
      - 'tests/test_lab7_frozen_config.py'
      - 'tests/test_drift.py'
      - 'configs/lab7.json'
      - '.github/workflows/lab7-ci.yml'
  workflow_dispatch:

jobs:
  lab7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install LAB7 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,tracking,monitoring]'
      - name: Verify frozen LAB4 published provenance
        run: python scripts/verify_lab4_data.py --check-git-index --check-published
      - name: Test streaming, parallel batch and real Evidently
        run: |
          python -m pytest -q tests/test_lab7_complete.py tests/test_lab7_frozen_config.py tests/test_drift.py \
            --cov=moons_lab.lab7_pipeline --cov=moons_lab.drift \
            --cov-report=term-missing
      - name: Short end-to-end smoke with MLflow (not official benchmark)
        run: |
          python scripts/run_lab7.py --quick \
            --report-dir "$RUNNER_TEMP/lab7_quick" \
            --runtime-dir "$RUNNER_TEMP/lab7_runtime"
