name: LAB6 service, registry, monitoring
on:
  push:
    branches: [main, 'lab6/**']
  pull_request:
    branches: [main]
jobs:
  lab6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: LAB4 source integrity remains frozen
        run: python scripts/verify_lab4_data.py --check-published
      - name: Service contracts + lab6 negatives
        run: python -m pytest -q tests/test_service.py tests/test_lab6_service.py
      - name: LAB6 runner
        run: python scripts/run_lab6.py --quick --report-dir demo_output/LAB6 --runtime-dir demo_output/LAB6_runtime
      - name: Existing LAB4 smoke/integration
        run: python -m pytest -q tests/test_lab4_workflow.py tests/test_demo_lab4_integration.py
