name: Lab 1 CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lab1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and test tools
        run: pip install -e ".[test]"

      - name: Generate deterministic dataset
        run: python scripts/prepare_data.py

      - name: Run Lab 1 tests
        run: python -m pytest tests/test_data.py tests/test_eda.py -q

      - name: Run project checks
        run: python scripts/precommit_checks.py --all

      - name: Run pre-commit
        run: pre-commit run --all-files
