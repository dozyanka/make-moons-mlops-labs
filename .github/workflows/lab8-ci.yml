name: LAB8 full-system smoke and frozen provenance
on:
  pull_request:
    paths:
      - 'src/moons_lab/lab8_*'
      - 'scripts/lab8_*'
      - 'scripts/run_lab8.py'
      - 'tests/test_lab8_full.py'
      - 'configs/lab8_full.json'
      - 'DEMO/menu.py'
      - '.github/workflows/lab8-ci.yml'
      - '.gitattributes'
      - 'reports/LAB8/**'
  push:
    paths:
      - 'src/moons_lab/lab8_*'
      - 'scripts/lab8_*'
      - 'scripts/run_lab8.py'
      - 'tests/test_lab8_full.py'
      - 'configs/lab8_full.json'
      - 'DEMO/menu.py'
      - '.github/workflows/lab8-ci.yml'
      - '.gitattributes'
      - 'reports/LAB8/**'
  workflow_dispatch:

jobs:
  lab8:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[all,report]'
      - name: Frozen LAB4 code provenance and data
        run: python scripts/verify_lab4_data.py --check-git-index --check-published
      - name: Test LAB8 Pydantic, alerting, checkpoint and live-acceptance rules
        run: |
          python -m pytest -q tests/test_lab8_full.py tests/test_lab7_frozen_config.py \
            --cov=moons_lab.lab8_config --cov=moons_lab.lab8_live \
            --cov=moons_lab.lab8_observability --cov-report=term-missing
      - name: Reproducible short real HTTP smoke (not a full LAB8 result)
        run: |
          python scripts/run_lab8.py --quick \
            --report-dir "$RUNNER_TEMP/lab8_quick" \
            --runtime-dir "$RUNNER_TEMP/lab8_runtime"
      - name: Full-run evidence is separate
        run: echo "Full wall-clock drills >=55min must be run on target machine and reviewed separately."
      - name: "Verify sealed full evidence across PR #36 squash merge"
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f reports/LAB8/summary.json ]; then
            echo 'Full evidence not yet published; quick smoke only.'
            exit 0
          fi
          # Squash merges do not preserve PR commit ancestry. Do NOT rewrite
          # the original run SHA, source manifest or full-run evidence.
          original_ref='refs/remotes/origin/lab8-original-pr36'
          expected_original='f0dbbc537270ab036156c65a9ed14ad6d6b83ba6'
          git fetch --no-tags origin "+refs/pull/36/head:${original_ref}"
          actual_original="$(git rev-parse "${original_ref}")"
          if [ "${actual_original}" != "${expected_original}" ]; then
            echo "LAB8 provenance FAIL: unexpected original PR #36 head: ${actual_original}"
            exit 1
          fi
          # The published application, every evidence file, and the SHA-256
          # manifest must remain identical to the independently audited PR.
          # Only this CI YAML file may differ after the squash merge.
          if ! git diff --quiet "${actual_original}" HEAD -- . \
              ':(exclude).github/workflows/lab8-ci.yml' \
              ':(exclude)DEMO/README.md' \
              ':(exclude)DEMO/menu.py' \
              ':(exclude)README.md' \
              ':(exclude)reports/LAB4/lab4_report.md' \
              ':(exclude)reports/LAB5/lab5_report.md' \
              ':(exclude)reports/LAB6/lab6_report.md' \
              ':(exclude)reports/LAB7/lab7_report.md' \
              ':(exclude)reports/LABS_OVERVIEW.md'; then
            echo 'LAB8 provenance FAIL: merged code/evidence differs from audited PR #36'
            git diff --name-status "${actual_original}" HEAD -- . \
              ':(exclude).github/workflows/lab8-ci.yml' \
              ':(exclude)DEMO/README.md' \
              ':(exclude)DEMO/menu.py' \
              ':(exclude)README.md' \
              ':(exclude)reports/LAB4/lab4_report.md' \
              ':(exclude)reports/LAB5/lab5_report.md' \
              ':(exclude)reports/LAB6/lab6_report.md' \
              ':(exclude)reports/LAB7/lab7_report.md' \
              ':(exclude)reports/LABS_OVERVIEW.md'
            exit 1
          fi
          audit_worktree="${RUNNER_TEMP}/lab8-original-pr36-audit"
          git worktree add --detach "${audit_worktree}" "${actual_original}"
          (
            cd "${audit_worktree}"
            python scripts/lab8_verify_full.py --report-dir reports/LAB8
          )
          echo 'LAB8 PASS: original ancestry, full-run metrics, SHA-256 manifest and identical merged source/evidence'
