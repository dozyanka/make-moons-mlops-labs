[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "make-moons-mlops-labs"
version = "1.0.0"
description = "Eight end-to-end MLOps laboratory works for variant 09: make_moons nonlinearity"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Vladimir"}]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "joblib>=1.4,<2",
  "pydantic>=2.8,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<1",
  "psutil>=5.9,<8",
]

[project.optional-dependencies]
dl = ["torch>=2.4,<3"]
tracking = ["mlflow>=2.17,<4"]
monitoring = ["evidently>=0.7,<1"]
test = ["pytest>=8,<10", "pytest-cov>=5,<8", "httpx>=0.27,<1", "pre-commit>=4,<5"]
all = [
  "torch>=2.4,<3",
  "mlflow>=2.17,<4",
  "evidently>=0.7,<1",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "httpx>=0.27,<1",
]

report = ["python-docx>=1.1,<2"]

[project.scripts]
train_ml = "moons_lab.cli:train_ml_entry"
train_dl = "moons_lab.cli:train_dl_entry"
train_validator = "moons_lab.cli:train_validator_entry"
generate = "moons_lab.cli:generate_entry"
serve = "moons_lab.cli:serve_entry"
evaluate = "moons_lab.cli:evaluate_entry"
monitor = "moons_lab.cli:monitor_entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["moons_lab"]
omit = [
  "src/moons_lab/cli.py",
  "src/moons_lab/evidently_adapter.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]


